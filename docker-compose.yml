version: "3.8"

services:
  app:
    build: .
    container_name: forge_app
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - n8n
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: forge_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: forge_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=forge
      - POSTGRES_PASSWORD=forgepass
      - POSTGRES_DB=forge_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  n8n_data:
  postgres_data:
